services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    environment:
      HOST: 0.0.0.0
      PORT: 5000
      METAGUARD_DB_PATH: /data/security.db
      METAGUARD_ALLOWED_ORIGINS: http://localhost:5173,http://127.0.0.1:5173
      METAGUARD_CLOUD_FINDINGS_MODE: ${METAGUARD_CLOUD_FINDINGS_MODE:-demo}
      METAGUARD_CLOUD_FINDINGS_PROVIDER: ${METAGUARD_CLOUD_FINDINGS_PROVIDER:-aws_security_hub}
      METAGUARD_PROWLER_DATA_DIR: /data/prowler
      PROWLER_EXECUTABLE: ${PROWLER_EXECUTABLE:-/usr/local/bin/prowler}
      PROWLER_SCAN_TIMEOUT_SECONDS: ${PROWLER_SCAN_TIMEOUT_SECONDS:-1800}
      AWS_REGION: ${AWS_REGION:-}
      AWS_DEFAULT_REGION: ${AWS_DEFAULT_REGION:-}
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID:-}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY:-}
      AWS_SESSION_TOKEN: ${AWS_SESSION_TOKEN:-}
      AWS_ROLE_ARN: ${AWS_ROLE_ARN:-}
      AWS_WEB_IDENTITY_TOKEN_FILE: ${AWS_WEB_IDENTITY_TOKEN_FILE:-}
      AWS_EC2_METADATA_DISABLED: "true"
      AZURE_CLIENT_ID: ${AZURE_CLIENT_ID:-}
      AZURE_CLIENT_SECRET: ${AZURE_CLIENT_SECRET:-}
      AZURE_TENANT_ID: ${AZURE_TENANT_ID:-}
      AZURE_SUBSCRIPTION_ID: ${AZURE_SUBSCRIPTION_ID:-}
      GOOGLE_APPLICATION_CREDENTIALS: ${GOOGLE_APPLICATION_CREDENTIALS:-}
      GOOGLE_CLOUD_PROJECT: ${GOOGLE_CLOUD_PROJECT:-}
    ports:
      - "127.0.0.1:5050:5000"
    volumes:
      - metaguard-data:/data
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:5000/api/health', timeout=2)"
      interval: 10s
      timeout: 3s
      retries: 5

  frontend:
    image: node:22-alpine
    working_dir: /app
    command: sh -c "npm ci && npm run dev -- --host 0.0.0.0 --port 5173"
    environment:
      VITE_API_PROXY_TARGET: http://backend:5000
    ports:
      - "127.0.0.1:5173:5173"
    volumes:
      - .:/app
      - frontend-node-modules:/app/node_modules
    depends_on:
      backend:
        condition: service_healthy

volumes:
  metaguard-data:
  frontend-node-modules:
